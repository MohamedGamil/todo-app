<form class="max-w-md mx-auto mt-10 p-8 bg-white rounded shadow" [formGroup]="formData" (ngSubmit)="onSubmit()">
    <h2 class="text-2xl font-bold mb-6 text-center">Welcome back!</h2>

    <div class="mb-4">
        <label for="email" class="block text-gray-700 mb-2">Email</label>
        <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your email"
        />
        <div *ngIf="formData.get('email')?.invalid && formData.get('email')?.touched" class="text-red-500 text-sm mt-1">
            Valid email is required.
        </div>
    </div>

    <div class="mb-6">
        <label for="password" class="block text-gray-700 mb-2">Password</label>
        <input
            id="password"
            type="password"
            formControlName="password"
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your password"
        />
        <div *ngIf="formData.get('password')?.invalid && formData.get('password')?.touched" class="text-red-500 text-sm mt-1">
            Password is required.
        </div>
    </div>

    <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
        [ngClass]="{ 'opacity-50 cursor-not-allowed': formData.invalid  }"
        [attr.aria-disabled]="formData.invalid ? 'true' : 'false'"
        [disabled]="formData.invalid"
    >
        Login
    </button>
</form>
